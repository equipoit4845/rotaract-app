services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kernel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-institutional_kernel}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    restart: unless-stopped
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]
    volumes: [nats-data:/data]
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      KERNEL_DATABASE_URL: ${KERNEL_DATABASE_URL:?KERNEL_DATABASE_URL must be set in .env}
      KERNEL_DIRECT_URL: ${KERNEL_DIRECT_URL:?KERNEL_DIRECT_URL must be set in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      # Developer platform (docs/11-developer-platform-auth.md): encrypts the
      # ES256 signing keys at rest; the issuer is the public API base URL.
      KERNEL_SIGNING_KEY_SECRET: ${KERNEL_SIGNING_KEY_SECRET:?KERNEL_SIGNING_KEY_SECRET must be set in .env}
      KERNEL_ISSUER_URL: ${KERNEL_ISSUER_URL:-http://localhost:3001/api/kernel/v1}
      KERNEL_CORS_ORIGINS: ${KERNEL_CORS_ORIGINS:-https://app.rotaract4845.com,http://localhost:3000}
      KERNEL_SERVICE_API_KEY: ${KERNEL_SERVICE_API_KEY:-}
      KERNEL_JOBS_ENABLED: "false"
      # E7 (docs/13-events-and-webhooks.md): both off in production.
      KERNEL_WEBHOOKS_ALLOW_INSECURE: ${KERNEL_WEBHOOKS_ALLOW_INSECURE:-false}
      KERNEL_WEBHOOK_STREAM_ENABLED: ${KERNEL_WEBHOOK_STREAM_ENABLED:-false}
      CLICKMAIL_API_KEY: ${CLICKMAIL_API_KEY:-}
      CLICKMAIL_BASE_URL: ${CLICKMAIL_BASE_URL:-http://localhost:3000}
      CLICKMAIL_FROM_ADDRESS: ${CLICKMAIL_FROM_ADDRESS:-Mi Rotaract <no-reply@mirotaract.org>}
      KERNEL_PUBLIC_WEB_URL: ${KERNEL_PUBLIC_WEB_URL:-http://localhost:3000}
    ports: ["127.0.0.1:3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      nats: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:3001/health/live"]
      interval: 10s
      timeout: 3s
      retries: 12

  worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      KERNEL_WORKER_ONLY: "true"
      KERNEL_DATABASE_URL: ${KERNEL_DATABASE_URL:?KERNEL_DATABASE_URL must be set in .env}
      KERNEL_DIRECT_URL: ${KERNEL_DIRECT_URL:?KERNEL_DIRECT_URL must be set in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      KERNEL_SIGNING_KEY_SECRET: ${KERNEL_SIGNING_KEY_SECRET:?KERNEL_SIGNING_KEY_SECRET must be set in .env}
      KERNEL_ISSUER_URL: ${KERNEL_ISSUER_URL:-http://localhost:3001/api/kernel/v1}
      KERNEL_JOBS_ENABLED: "true"
      # E7: the worker delivers webhooks (outbound HTTPS to third parties).
      KERNEL_WEBHOOKS_ALLOW_INSECURE: ${KERNEL_WEBHOOKS_ALLOW_INSECURE:-false}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      nats: { condition: service_healthy }

  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command:
      [
        "pnpm",
        "--filter",
        "@mirotaract/institutional-kernel-api",
        "prisma:deploy",
      ]
    environment:
      KERNEL_DATABASE_URL: ${KERNEL_DATABASE_URL:?KERNEL_DATABASE_URL must be set in .env}
      KERNEL_DIRECT_URL: ${KERNEL_DIRECT_URL:?KERNEL_DIRECT_URL must be set in .env}
    depends_on:
      postgres: { condition: service_healthy }
    profiles: ["tools"]

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_KERNEL_API_URL: ${NEXT_PUBLIC_KERNEL_API_URL:-http://localhost:3001/api/kernel/v1}
    environment:
      NEXT_PUBLIC_KERNEL_API_URL: ${NEXT_PUBLIC_KERNEL_API_URL:-http://localhost:3001/api/kernel/v1}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }

  # E9 — developer portal (docs/16-developer-portal.md), behind
  # developers.rotaract4845.com. Static content; no database or secrets.
  developers-portal:
    restart: unless-stopped
    build:
      context: .
      dockerfile: infra/docker/developers-portal.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${DEVELOPERS_PORTAL_SITE_URL:-}
    environment:
      NEXT_PUBLIC_SITE_URL: ${DEVELOPERS_PORTAL_SITE_URL:-}
    ports: ["127.0.0.1:3004:3004"]

volumes:
  postgres-data:
  redis-data:
  nats-data:
