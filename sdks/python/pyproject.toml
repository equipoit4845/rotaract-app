[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mirotaract"
version = "0.1.0"
description = "SDK oficial de Mi Rotaract: API de datos institucionales e \"Ingresar con Mi Rotaract\" (OAuth 2.0 + OpenID Connect)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Mi Rotaract" }]
dependencies = [
  "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.8,<3",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]
dev = [
  "pytest>=8",
  "fastapi>=0.110",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mirotaract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
