name: Design System Release

# Dormant until this repo's GITHUB_TOKEN has `packages: write` (already
# requested below) and — if the default token's package permissions are
# ever restricted at the org level — a PAT with write:packages saved as a
# repo secret and swapped in for NODE_AUTH_TOKEN. No human needs to run
# `pnpm changeset publish` by hand; merging a changeset to main is enough.
on:
  push:
    branches: [main]
    paths:
      - "packages/design-tokens/**"
      - "packages/icons/**"
      - "packages/ui/**"
      - "packages/admin-shell/**"
      - ".changeset/**"
  # Lets a maintainer force a run without an unrelated package touch —
  # e.g. after a workflow-only fix, or to retry a run that failed on CI
  # infra rather than on the packages themselves.
  workflow_dispatch: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Must precede actions/setup-node's cache:pnpm — that cache step shells
      # out to `pnpm store path`, which fails if pnpm isn't on PATH yet.
      - uses: pnpm/action-setup@v4
        with: { version: 10.13.1 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://npm.pkg.github.com"
          scope: "@equipoit4845"
      - run: pnpm install --frozen-lockfile
      # On a changeset-less main, this opens/updates a "Version Packages" PR.
      # Once that PR merges (versions bumped, changelogs written), this same
      # job runs again and this time actually publishes to GitHub Packages.
      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
