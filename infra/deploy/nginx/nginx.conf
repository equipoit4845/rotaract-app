# E12.2 — edge proxy for zero-downtime deploys (docs/19-operations-e12.md).
# Which slot (blue/green) serves api and web lives in
# /etc/nginx/active/upstreams.conf, rewritten by scripts/deploy.sh before a
# graceful `nginx -s reload`: old workers finish their requests, new ones
# use the new slot. Upstream names are resolved at request time (Docker DNS),
# so nginx starts even while a slot is stopped.
worker_processes 1;
# Long-lived connections (SSE event stream) on old workers get this long to
# finish after a reload; the deploy drains for as long before stopping.
worker_shutdown_timeout 30s;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  access_log off;
  error_log /dev/stderr warn;
  server_tokens off;

  client_max_body_size 50m;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  proxy_connect_timeout 5s;

  # Defines $api_upstream and $web_upstream (host:port of the live slot).
  include /etc/nginx/active/upstreams.conf;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" "";
  }

  # Headers forwarded as they came: the kernel trusts CF-Connecting-IP and
  # the FIRST X-Forwarded-For entry from private hops (KernelThrottlerGuard),
  # and $proxy_add_x_forwarded_for only appends.
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  server {
    listen 3001;
    location / {
      proxy_pass http://$api_upstream;
      # A connection refused before any byte was sent is safe to retry once
      # (the slot is going away); nginx never retries after sending.
      proxy_next_upstream error;
    }
  }

  server {
    listen 3000;
    location / {
      proxy_pass http://$web_upstream;
      proxy_next_upstream error;
    }
  }

  server {
    listen 8080;
    location = /edge-health {
      return 200 "ok\n";
    }
    location = /edge-active {
      default_type text/plain;
      return 200 "api=$api_upstream web=$web_upstream\n";
    }
  }
}
