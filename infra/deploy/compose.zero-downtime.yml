# E12.2 — zero-downtime overlay (docs/19-operations-e12.md).
#
#   docker compose -f docker-compose.yml -f infra/deploy/compose.zero-downtime.yml ...
#   (or COMPOSE_FILE=docker-compose.yml:infra/deploy/compose.zero-downtime.yml in .env)
#
# A tiny nginx ("edge", ~5 MB of RAM) takes over the host ports of the api
# (127.0.0.1:3001) and the web (127.0.0.1:3000), so cloudflared does not
# change. Behind it, each of api and web has two slots, blue and green; only
# one runs between deploys. scripts/deploy.sh starts the idle slot with the
# new image, waits until it is healthy, points nginx at it (graceful reload:
# in-flight requests finish on the old slot), drains and stops the old one,
# and rolls back if anything fails. Two copies run only during a deploy.
#
# The edge also answers to the in-network names `api` and `web`, so
# meetings-api (KERNEL_API_URL=http://api:3001/...), the portal and the
# worker's status probes keep working unchanged.
#
# The plain `api` and `web` services are parked under the "legacy" profile.
# Images are built once by deploy.sh and tagged <prefix>-api:<slot> /
# <prefix>-web:<slot>; nothing here builds.
services:
  api:
    profiles: ["legacy"]
  web:
    profiles: ["legacy"]

  api-blue: &api-slot
    extends:
      file: docker-compose.yml # relative to the project directory
      service: api
    image: ${DEPLOY_IMAGE_PREFIX:-mirotaract}-api:blue
    pull_policy: never
    build: !reset null
    ports: !reset []
    profiles: !reset []
  api-green:
    <<: *api-slot
    image: ${DEPLOY_IMAGE_PREFIX:-mirotaract}-api:green

  web-blue: &web-slot
    extends:
      file: docker-compose.yml # relative to the project directory
      service: web
    image: ${DEPLOY_IMAGE_PREFIX:-mirotaract}-web:blue
    pull_policy: never
    build: !reset null
    ports: !reset []
    profiles: !reset []
    depends_on: !reset {}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  web-green:
    <<: *web-slot
    image: ${DEPLOY_IMAGE_PREFIX:-mirotaract}-web:green

  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3001}:3001"
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    volumes:
      - ./infra/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Written by scripts/deploy.sh: which slot serves api and web.
      - ${DEPLOY_STATE_DIR:-./infra/deploy/state}:/etc/nginx/active:ro
    networks:
      default:
        aliases: [api, web]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/edge-health"]
      interval: 10s
      timeout: 3s
      retries: 6
